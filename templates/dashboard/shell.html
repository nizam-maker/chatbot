<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}Dashboard{% endblock %} — ChatPlatform</title>
<link rel="stylesheet" href="/static/dashboard/css/dashboard.css"/>
{% block extra_head %}{% endblock %}
</head>
<body data-roles="tenant,admin">

<aside class="sidebar">
  {% include "dashboard/_sidebar.html" %}
</aside>

<div class="main">
  <div id="main-swap">
    <div class="topbar">
      <div>
        <h1>{% block page_title %}{% endblock %}</h1>
        <p id="topbar-sub">{% block page_sub %}{% endblock %}</p>
      </div>
      <div class="topbar-actions">{% block topbar_actions %}{% endblock %}</div>
    </div>
    <div class="content" id="content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

{% block modals %}{% endblock %}

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script src="/static/dashboard/auth.js"></script>
<script src="/static/dashboard/js/views/tenant_overview.js"></script>
<script src="/static/dashboard/js/views/tenant_leads.js"></script>
<script src="/static/dashboard/js/views/tenant_inventory.js"></script>
<script src="/static/dashboard/js/views/tenant_files.js"></script>
<script src="/static/dashboard/js/views/tenant_scraper.js"></script>
<script src="/static/dashboard/js/views/tenant_api.js"></script>
<script src="/static/dashboard/js/htmx-init.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
