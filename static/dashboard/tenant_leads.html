<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Leads — ChatPlatform</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a6f4a;--primary-h:#145a3c;
  --bg:#f4f3ef;--surface:#fff;--border:#e2e0d8;
  --text:#1c1c1a;--muted:#7a7870;
  --success:#1D9E75;--danger:#E24B4A;--warning:#EF9F27;--info:#3B7DD8;
  --font:"Segoe UI",system-ui,sans-serif;--mono:"Cascadia Code","Fira Mono",monospace;--radius:10px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex}
.sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.sidebar-logo{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.logo-text{font-size:14px;font-weight:600}.logo-sub{font-size:11px;color:var(--muted)}
nav{padding:10px 8px;flex:1}
.nav-section{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .15s;text-decoration:none;margin-bottom:1px}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:#e8f4ee;color:var(--primary);font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:16px;font-weight:600}.topbar p{font-size:13px;color:var(--muted)}
.topbar-actions{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:500;background:transparent;color:var(--text);cursor:pointer;transition:all .15s;text-decoration:none}
.btn:hover{background:var(--bg)}.btn:active{transform:scale(.98)}
.content{flex:1;overflow-y:auto;padding:24px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:600}
.stat-val.green{color:var(--success)}
.stat-val.amber{color:var(--warning)}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.table-toolbar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.table-toolbar input{flex:1;min-width:160px;padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:var(--bg);color:var(--text);outline:none}
.table-toolbar input:focus{border-color:var(--primary)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf9}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;border:1px solid}
.badge-ok{background:#e8f4ee;color:var(--success);border-color:#5dcaa5}
.badge-off{background:#f5f4f0;color:var(--muted);border-color:var(--border)}
.phone-link{color:var(--primary);text-decoration:none;font-family:var(--mono);font-size:12px}
.phone-link:hover{text-decoration:underline}

.empty-state{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:800px){.sidebar{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body data-roles="tenant,admin">

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark" id="s-initials">CP</div>
    <div><div class="logo-text" id="s-name">My Dashboard</div><div class="logo-sub">ChatPlatform</div></div>
  </div>
  <nav>
    <div class="nav-section">Overview</div>
    <a href="/dashboard/tenant" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <div class="nav-section">My Chatbot</div>
    <a href="/dashboard/tenant/analytics" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Analytics
    </a>
    <a href="/dashboard/tenant/leads" class="nav-item active">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      My Leads
    </a>
    <a href="/dashboard/tenant/inventory" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      Inventory Data
    </a>
    <div class="nav-section">Knowledge</div>
    <a href="/dashboard/tenant/files" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      File manager
    </a>
    <a href="/dashboard/tenant/scraper" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20"/></svg>
      Scraper
    </a>
    <div class="nav-section">Settings</div>
    <a href="/dashboard/tenant/api" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
      API Manager
    </a>
  </nav>
  <div class="sidebar-footer"></div>
</aside>

<div class="main">
  <div class="topbar">
    <div>
      <h1>My Leads</h1>
      <p id="topbar-sub">Contacts captured by your chatbot</p>
    </div>
    <div class="topbar-actions">
      <button class="btn" onclick="loadLeads()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="content">

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total leads</div>
        <div class="stat-val" id="s-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Notified</div>
        <div class="stat-val green" id="s-notified">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-val amber" id="s-pending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Last captured</div>
        <div class="stat-val" id="s-last" style="font-size:14px">—</div>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-toolbar">
        <input type="text" id="search" placeholder="Search by name, phone or interest..." oninput="renderTable()"/>
        <span style="font-size:12px;color:var(--muted)" id="row-count"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Interest</th>
            <th>Source</th>
            <th>Captured</th>
            <th>Notified</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" class="empty-state"><span class="spinner"></span> Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<script>
let tenantId = null;
let allLeads = [];

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("en-MY", {day:"2-digit",month:"short",year:"numeric"}) +
    " " + d.toLocaleTimeString("en-MY", {hour:"2-digit",minute:"2-digit"});
}

async function init() {
  await new Promise(r => setTimeout(r, 300));
  const profile = window._profile;
  if (!profile?.tenant_id) return;
  tenantId = profile.tenant_id;

  const t = await fetch(`/api/tenants/${tenantId}`).then(r => r.json());
  document.getElementById("s-initials").textContent      = t.brand_initials || "CP";
  document.getElementById("s-initials").style.background = t.brand_color || "#1a6f4a";
  document.getElementById("s-name").textContent          = t.name || "My Dashboard";
  document.getElementById("topbar-sub").textContent      = `${t.name} — contacts captured by your chatbot`;
  document.documentElement.style.setProperty("--primary", t.brand_color || "#1a6f4a");

  await loadLeads();
}

async function loadLeads() {
  if (!tenantId) return;
  const res = await authedFetch(`/api/tenant/${tenantId}/leads`);
  allLeads  = await res.json();
  renderTable();
}

function renderTable() {
  const q = document.getElementById("search").value.toLowerCase();

  const rows = allLeads.filter(l => {
    if (!q) return true;
    return (l.name || "").toLowerCase().includes(q)
        || (l.phone || "").toLowerCase().includes(q)
        || (l.interest || "").toLowerCase().includes(q);
  });

  document.getElementById("row-count").textContent = `${rows.length} of ${allLeads.length} leads`;

  const notified = allLeads.filter(l => l.notified);
  document.getElementById("s-total").textContent    = allLeads.length;
  document.getElementById("s-notified").textContent = notified.length;
  document.getElementById("s-pending").textContent  = allLeads.length - notified.length;
  document.getElementById("s-last").textContent     = allLeads.length ? fmtDate(allLeads[0].created_at) : "—";

  const tbody = document.getElementById("tbody");
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No leads captured yet</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(l => `
    <tr>
      <td style="font-weight:500">${l.name || "—"}</td>
      <td><a class="phone-link" href="tel:${l.phone}">${l.phone || "—"}</a></td>
      <td>${l.interest || "—"}</td>
      <td style="color:var(--muted);font-size:12px">${l.source || "chatbot"}</td>
      <td style="font-size:12px;color:var(--muted)">${fmtDate(l.created_at)}</td>
      <td><span class="badge ${l.notified ? "badge-ok" : "badge-off"}">${l.notified ? "Notified" : "Pending"}</span></td>
    </tr>`).join("");
}

init();
</script>
<script src="/static/dashboard/auth.js"></script>
</body>
</html>
