<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — ChatPlatform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a6f4a;--primary-h:#145a3c;
  --bg:#f4f3ef;--surface:#fff;--border:#e2e0d8;
  --text:#1c1c1a;--muted:#7a7870;
  --danger:#E24B4A;--warning:#EF9F27;
  --font:"Segoe UI",system-ui,sans-serif;--radius:10px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);
     min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--surface);border:1px solid var(--border);
      border-radius:16px;padding:36px 40px;width:100%;max-width:400px;
      box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.logo-mark{width:36px;height:36px;border-radius:9px;background:var(--primary);
           display:flex;align-items:center;justify-content:center;
           color:#fff;font-size:14px;font-weight:700}
.logo-text{font-size:16px;font-weight:600}
.logo-sub{font-size:12px;color:var(--muted)}
h1{font-size:20px;font-weight:600;margin-bottom:4px}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:24px}
.field{margin-bottom:14px}
.field label{font-size:12px;font-weight:500;color:var(--muted);display:block;margin-bottom:4px}
.field input{width:100%;padding:10px 13px;border:1px solid var(--border);
             border-radius:8px;font-size:14px;background:var(--bg);
             color:var(--text);outline:none;transition:border-color .2s;font-family:var(--font)}
.field input:focus{border-color:var(--primary)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:40px}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);
        background:none;border:none;cursor:pointer;color:var(--muted);
        display:flex;align-items:center;padding:2px}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:14px;
     font-weight:500;cursor:pointer;background:var(--primary);color:#fff;
     transition:background .15s;font-family:var(--font)}
.btn:hover{background:var(--primary-h)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.link-btn{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;
          font-size:14px;font-weight:500;cursor:pointer;background:transparent;
          color:var(--text);transition:all .15s;font-family:var(--font);text-align:center;
          display:block;text-decoration:none}
.link-btn:hover{background:var(--bg)}
.alert{font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none}
.alert.err{background:#fce8e8;color:var(--danger);border:1px solid #f09595;display:block}
.alert.warn{background:#faeeda;color:#633806;border:1px solid #efb347;display:block}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);
         border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;
         vertical-align:middle;margin-right:6px;display:none}
.spinner.show{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">CP</div>
    <div><div class="logo-text">ChatPlatform</div><div class="logo-sub">Management dashboard</div></div>
  </div>

  <h1>Sign in</h1>
  <p class="subtitle">Enter your credentials to continue</p>

  <div class="alert" id="alert"></div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com"
           onkeydown="if(event.key==='Enter')login()"/>
  </div>
  <div class="field">
    <label>Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" placeholder="••••••••"
             onkeydown="if(event.key==='Enter')login()"/>
      <button type="button" class="pw-eye" onclick="togglePw('password',this)" tabindex="-1" aria-label="Show password">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <button class="btn" id="login-btn" onclick="login()">
    <span class="spinner" id="spinner"></span>
    Sign in
  </button>

  <div class="divider">or</div>
  <a href="/dashboard/register" class="link-btn">Create new account</a>
</div>

<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show
    ? '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}

let _sb = null;

async function getSb() {
  if (_sb) return _sb;
  const cfg = await fetch("/api/public-config").then(r => r.json());
  _sb = supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);
  return _sb;
}

// Check already logged in
(async () => {
  const sb = await getSb();
  const { data: { session } } = await sb.auth.getSession();
  if (session) await redirectByRole(sb, session.user);
})();

async function redirectByRole(sb, user) {
  const { data: profile } = await sb
    .from("profiles")
    .select("role, is_approved, tenant_id")
    .eq("id", user.id)
    .single();

  if (!profile) { showAlert("Profile not found. Contact admin.", "err"); return; }
  if (!profile.is_approved) {
    showAlert("Your account is pending admin approval.", "warn");
    await sb.auth.signOut();
    return;
  }

  if (profile.role === "admin") {
    window.location.href = "/dashboard";
  } else {
    window.location.href = "/dashboard/tenant";
  }
}

async function login() {
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn      = document.getElementById("login-btn");
  const spinner  = document.getElementById("spinner");

  if (!email || !password) { showAlert("Please enter email and password.", "err"); return; }

  btn.disabled = true;
  spinner.classList.add("show");
  clearAlert();

  try {
    const sb = await getSb();
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showAlert(error.message, "err"); return; }
    await redirectByRole(sb, data.user);
  } catch(e) {
    showAlert("Connection error. Is the server running?", "err");
  } finally {
    btn.disabled = false;
    spinner.classList.remove("show");
  }
}

function showAlert(msg, type) {
  const el = document.getElementById("alert");
  el.textContent = msg;
  el.className = "alert " + type;
}
function clearAlert() {
  document.getElementById("alert").className = "alert";
}
</script>
</body>
</html>
