<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chatbot</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary:   #1a6f4a;
    --primary-h: #145a3c;
    --bg:        #f4f3ef;
    --surface:   #ffffff;
    --border:    #e2e0d8;
    --user-bg:   #1a6f4a;
    --user-txt:  #ffffff;
    --bot-bg:    #ffffff;
    --bot-txt:   #1c1c1a;
    --muted:     #7a7870;
    --tag-bg:    #e8f4ee;
    --tag-txt:   #1a6f4a;
    --radius:    12px;
    --font:      "Segoe UI", system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Header ── */
  header {
    width: 100%;
    background: var(--primary);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    position: sticky; top: 0; z-index: 10;
  }
  .logo {
    width: 36px; height: 36px;
    background: rgba(255,255,255,.2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header p  { font-size: 12px; opacity: .75; }
  .status-dot {
    width: 8px; height: 8px; background: #5ddf8a;
    border-radius: 50%; margin-left: auto;
    box-shadow: 0 0 0 3px rgba(93,223,138,.25);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }

  /* ── Layout ── */
  .layout {
    display: flex;
    width: 100%; max-width: 1100px;
    height: calc(100vh - 66px);
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 270px; min-width: 270px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section h3 {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin-bottom: 10px;
  }
  .info-row {
    display: flex; justify-content: space-between;
    font-size: 13px; margin-bottom: 6px;
  }
  .info-row span:first-child { color: var(--muted); }
  .info-row span:last-child  {
    font-weight: 500; max-width: 140px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .domain-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    background: var(--tag-bg); color: var(--tag-txt);
    font-size: 10px; font-weight: 500;
    padding: 2px 8px; border-radius: 20px;
    border: 1px solid rgba(26,111,74,.2);
  }

  /* ingest form */
  .ingest-form { display: flex; flex-direction: column; gap: 7px; }
  .ingest-form select,
  .ingest-form input[type=text] {
    width: 100%; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 12px; background: var(--bg);
    outline: none;
  }
  .ingest-form select:focus,
  .ingest-form input:focus { border-color: var(--primary); }
  .file-label {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 10px;
    border: 1.5px dashed var(--border); border-radius: 8px;
    font-size: 12px; color: var(--muted); cursor: pointer;
    transition: border-color .2s;
  }
  .file-label:hover { border-color: var(--primary); }
  .file-label input { display: none; }
  #file-name { font-size: 11px; color: var(--muted); }
  .btn {
    padding: 7px 12px; border: none; border-radius: 8px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: background .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-h); }
  .ingest-status {
    font-size: 11px; padding: 5px 9px;
    border-radius: 6px; display: none;
  }
  .ingest-status.ok  { background: #e8f4ee; color: #1a6f4a; display: block; }
  .ingest-status.err { background: #fce8e8; color: #b03030; display: block; }

  /* ── Chat area ── */
  .chat-wrap {
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden;
  }
  #messages {
    flex: 1; overflow-y: auto;
    padding: 20px 24px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
  }
  .bubble-row {
    display: flex; gap: 9px; align-items: flex-end;
    max-width: 80%;
  }
  .bubble-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .bubble-row.bot  { align-self: flex-start; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .avatar.bot  { background: var(--primary); color: #fff; }
  .avatar.user { background: #d4edde; color: var(--primary); }
  .bubble {
    padding: 10px 14px; border-radius: var(--radius);
    font-size: 14px; line-height: 1.55; word-break: break-word;
  }
  .bubble.user {
    background: var(--user-bg); color: var(--user-txt);
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    background: var(--bot-bg); color: var(--bot-txt);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .bubble time {
    display: block; font-size: 10px;
    opacity: .5; margin-top: 5px; text-align: right;
  }

  /* typing dots */
  .typing { display: none; align-self: flex-start; }
  .typing.show { display: flex; }
  .dots { display: flex; gap: 4px; padding: 4px 0; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); display: block;
    animation: bounce .9s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .30s; }
  @keyframes bounce {
    0%,80%,100%{transform:translateY(0)}
    40%{transform:translateY(-7px)}
  }

  /* quick replies */
  .quick-replies {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 0 24px 10px;
  }
  .qr {
    padding: 6px 13px; border-radius: 20px;
    border: 1.5px solid var(--primary);
    background: transparent; color: var(--primary);
    font-size: 12px; cursor: pointer;
    transition: background .15s;
  }
  .qr:hover { background: var(--tag-bg); }

  /* input bar */
  .input-bar {
    padding: 12px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end;
  }
  #msg-input {
    flex: 1; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 22px;
    font-size: 14px; font-family: var(--font);
    resize: none; outline: none; max-height: 120px;
    background: var(--bg); line-height: 1.4;
    transition: border-color .2s;
  }
  #msg-input:focus { border-color: var(--primary); }
  #send-btn {
    width: 40px; height: 40px; border: none; border-radius: 50%;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background .15s, transform .1s;
  }
  #send-btn:hover  { background: var(--primary-h); }
  #send-btn:active { transform: scale(.93); }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 680px) {
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo" id="logo">AI</div>
  <div>
    <h1 id="bot-name">Loading...</h1>
    <p>Powered by Claude AI</p>
  </div>
  <div class="status-dot"></div>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3>Session</h3>
      <div class="info-row">
        <span>Session ID</span>
        <span id="sid-display">—</span>
      </div>
      <div class="info-row">
        <span>Customer</span>
        <span id="customer-display">Guest</span>
      </div>
      <div class="info-row">
        <span>Interest</span>
        <span id="interest-display">—</span>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Knowledge domains</h3>
      <div class="domain-tags" id="domain-tags">—</div>
    </div>

    <div class="sidebar-section" style="flex:1;overflow-y:auto">
      <h3>Ingest document</h3>
      <div class="ingest-form">
        <select id="ingest-domain"></select>
        <input type="text" id="ingest-brand" placeholder="Brand (e.g. Proton)"/>
        <input type="text" id="ingest-model" placeholder="Model (e.g. Saga)"/>
        <label class="file-label">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload PDF
          <input type="file" id="pdf-file" accept=".pdf"/>
        </label>
        <div id="file-name">No file selected</div>
        <button class="btn btn-primary" onclick="ingestPDF()">Ingest</button>
        <div class="ingest-status" id="ingest-status"></div>
      </div>
    </div>
  </aside>

  <!-- Chat -->
  <div class="chat-wrap">
    <div id="messages"></div>

    <!-- typing indicator -->
    <div class="bubble-row bot typing" id="typing">
      <div class="avatar bot" id="typing-avatar">AI</div>
      <div class="bubble bot">
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- quick replies -->
    <div class="quick-replies" id="quick-replies"></div>

    <!-- input -->
    <div class="input-bar">
      <textarea id="msg-input" rows="1"
        placeholder="Type your message..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  let sessionId    = crypto.randomUUID();
  let cfg          = {};
  let initials     = "AI";

  // ── Load config from API ──────────────────────────────────
  async function loadConfig() {
    try {
      const res  = await fetch("/api/config");
      cfg        = await res.json();
      initials   = cfg.brand_initials || "AI";

      // Apply branding
      document.title                        = cfg.bot_name || "Chatbot";
      document.getElementById("bot-name").textContent   = cfg.bot_name || "Assistant";
      document.getElementById("logo").textContent       = initials;
      document.getElementById("typing-avatar").textContent = initials;
      document.getElementById("sid-display").textContent   = sessionId.slice(0,8) + "…";

      // Apply brand colour
      if (cfg.brand_color) {
        document.documentElement.style.setProperty("--primary",   cfg.brand_color);
        document.documentElement.style.setProperty("--user-bg",   cfg.brand_color);
        document.documentElement.style.setProperty("--tag-txt",   cfg.brand_color);
      }

      // Domain tags + ingest dropdown
      const tagBox = document.getElementById("domain-tags");
      const sel    = document.getElementById("ingest-domain");
      tagBox.innerHTML = "";
      sel.innerHTML    = "";
      (cfg.domains || []).forEach(d => {
        const t = document.createElement("span");
        t.className   = "tag";
        t.textContent = d;
        tagBox.appendChild(t);
        const o = document.createElement("option");
        o.value = o.textContent = d;
        sel.appendChild(o);
      });

      // Quick replies
      const qr = document.getElementById("quick-replies");
      qr.innerHTML = "";
      (cfg.quick_replies || []).forEach(q => {
        const b = document.createElement("button");
        b.className   = "qr";
        b.textContent = q;
        b.onclick     = () => quickReply(q);
        qr.appendChild(b);
      });

      // Welcome message
      addBubble((cfg.welcome_msg || "Hello! How can I help?").replace(/\n/g, "<br>"), "bot", true);

    } catch(e) {
      addBubble("⚠️ Cannot connect to server. Make sure uvicorn is running.", "bot", true);
    }
  }

  // ── Bubble helpers ────────────────────────────────────────
  function now() {
    return new Date().toLocaleTimeString("en-MY", {hour:"2-digit", minute:"2-digit"});
  }

  function addBubble(html, role, isHtml = false) {
    const msgs   = document.getElementById("messages");
    const row    = document.createElement("div");
    row.className = `bubble-row ${role}`;

    const avatar       = document.createElement("div");
    avatar.className   = `avatar ${role}`;
    avatar.textContent = role === "bot" ? initials : "U";

    const bubble     = document.createElement("div");
    bubble.className = `bubble ${role}`;
    if (isHtml) {
      bubble.innerHTML = html + `<time>${now()}</time>`;
    } else {
      bubble.innerHTML = escHtml(html).replace(/\n/g,"<br>") + `<time>${now()}</time>`;
    }

    row.append(avatar, bubble);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escHtml(t) {
    return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function showTyping(show) {
    document.getElementById("typing").classList.toggle("show", show);
    const msgs = document.getElementById("messages");
    msgs.scrollTop = msgs.scrollHeight;
  }

  // ── Send message ──────────────────────────────────────────
  async function sendMessage() {
    const inp = document.getElementById("msg-input");
    const msg = inp.value.trim();
    if (!msg) return;

    inp.value = "";
    inp.style.height = "auto";
    addBubble(msg, "user");
    showTyping(true);

    try {
      const res  = await fetch("/api/chat", {
        method:  "POST",
        headers: {"Content-Type": "application/json"},
        body:    JSON.stringify({
          message:     msg,
          session_id:  sessionId,
          customer_id: "guest"
        })
      });
      const data = await res.json();
      showTyping(false);

      if (data.error) { addBubble("⚠️ " + data.error, "bot"); return; }

      addBubble(data.reply, "bot");
      sessionId = data.session_id;

      if (data.customer_name)
        document.getElementById("customer-display").textContent = data.customer_name;
      if (data.car_interest)
        document.getElementById("interest-display").textContent = data.car_interest;

    } catch(e) {
      showTyping(false);
      addBubble("⚠️ Server not reachable. Is uvicorn still running?", "bot");
    }
  }

  function quickReply(text) {
    document.getElementById("msg-input").value = text;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }

  // ── Ingest PDF ────────────────────────────────────────────
  document.getElementById("pdf-file").addEventListener("change", function() {
    document.getElementById("file-name").textContent =
      this.files[0]?.name || "No file selected";
  });

  async function ingestPDF() {
    const file   = document.getElementById("pdf-file").files[0];
    const domain = document.getElementById("ingest-domain").value;
    const brand  = document.getElementById("ingest-brand").value;
    const model  = document.getElementById("ingest-model").value;
    const status = document.getElementById("ingest-status");

    if (!file) { setStatus("Please select a PDF first.", false); return; }

    setStatus("Ingesting…", null);
    const fd = new FormData();
    fd.append("file", file);
    fd.append("domain", domain);
    fd.append("brand", brand);
    fd.append("model", model);

    try {
      const res  = await fetch("/api/ingest/pdf", {method:"POST", body:fd});
      const data = await res.json();
      if (data.status === "ok")
        setStatus(`✓ ${data.file} → ${data.domain} (${data.chunks} chunks)`, true);
      else
        setStatus("Error: " + JSON.stringify(data), false);
    } catch(e) {
      setStatus("Server error: " + e.message, false);
    }
  }

  function setStatus(msg, ok) {
    const el      = document.getElementById("ingest-status");
    el.textContent = msg;
    el.className  = "ingest-status" + (ok === true ? " ok" : ok === false ? " err" : "");
  }

  // ── Init ──────────────────────────────────────────────────
  loadConfig();
</script>
</body>
</html>
