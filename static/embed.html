<!DOCTYPE html>
<html lang="en" style="background:transparent;background-color:transparent">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat Widget</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a6f4a;--primary-h:#145a3c;
  --bg:rgba(0,0,0,0.15);
  --surface:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.15);
  --user-bg:#1a6f4a;--user-txt:#fff;
  --bot-bg:rgba(255,255,255,0.10);
  --bot-txt:#ffffff;
  --muted:rgba(255,255,255,0.6);
  --font:"Segoe UI",system-ui,sans-serif;--radius:12px;
}
html{
  height:100%;
  overflow:hidden;
  background:transparent !important;
  background-color:transparent !important;
}
body{
  height:100%;
  overflow:hidden;
  background:transparent !important;
  background-color:transparent !important;
  margin:0;
  padding:0;
  font-family:var(--font);
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:flex-end;
}

/* ── Bubble button ── */
#bubble-btn{width:52px;height:52px;border-radius:50%;
            background:var(--primary);border:none;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 4px 14px rgba(0,0,0,.18);
            position:fixed;bottom:20px;right:20px;z-index:999;
            transition:transform .15s,background .15s}
#bubble-btn:hover{transform:scale(1.08);background:var(--primary-h)}
#bubble-btn svg{transition:opacity .15s,transform .15s}
#bubble-btn .icon-chat{position:absolute}
#bubble-btn .icon-close{position:absolute;opacity:0;transform:rotate(-90deg)}
#bubble-btn.open .icon-chat{opacity:0;transform:rotate(90deg)}
#bubble-btn.open .icon-close{opacity:1;transform:rotate(0deg)}

/* ── Chat window ── */
#chat-window{position:fixed;bottom:86px;right:20px;
             width:360px;height:520px;
             background:rgba(0,0,0,0.45);
             background-color: transparent !important;
             backdrop-filter:blur(16px);
             -webkit-backdrop-filter:blur(16px);
             border:1px solid rgba(255,255,255,0.12);
             border-radius:16px;overflow:hidden;
             box-shadow:0 8px 40px rgba(0,0,0,.4);
             display:flex;flex-direction:column;
             transform:scale(.85) translateY(20px);
             opacity:0;pointer-events:none;
             transition:transform .2s cubic-bezier(.34,1.56,.64,1),
                         opacity .18s ease;
             transform-origin:bottom right}
#chat-window.open{transform:scale(1) translateY(0);
                  opacity:1;pointer-events:all}

/* Header */
.chat-head{padding:12px 16px;display:flex;align-items:center;
           gap:10px;color:#fff;flex-shrink:0}
.chat-avatar{width:32px;height:32px;border-radius:50%;
             background:rgba(255,255,255,.2);
             display:flex;align-items:center;justify-content:center;
             font-size:12px;font-weight:700;flex-shrink:0}
.head-title{font-size:14px;font-weight:600}
.head-sub{font-size:11px;opacity:.8}
.close-btn{margin-left:auto;background:none;border:none;
           color:#fff;cursor:pointer;opacity:.8;
           display:flex;align-items:center;justify-content:center;
           padding:4px;border-radius:50%;transition:opacity .15s}
.close-btn:hover{opacity:1}

/* Messages */
#messages{flex:1;overflow-y:auto;padding:14px 16px;
          display:flex;flex-direction:column;gap:10px}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.bubble-row{display:flex;gap:7px;align-items:flex-end;max-width:88%}
.bubble-row.user{align-self:flex-end;flex-direction:row-reverse}
.bubble-row.bot{align-self:flex-start}
.av{width:24px;height:24px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700}
.av-bot{background:var(--primary);color:#fff}
.av-user{background:#d4edde;color:var(--primary)}
.bubble{padding:8px 11px;border-radius:10px;font-size:13px;
        line-height:1.5;word-break:break-word}
.bubble.bot{background:var(--bot-bg);color:var(--bot-txt);
            border:1px solid var(--border);border-bottom-left-radius:3px}
.bubble.user{background:var(--user-bg);color:var(--user-txt);
             border-bottom-right-radius:3px}

/* Typing */
.typing{display:none;align-self:flex-start}
.typing.show{display:flex}
.dots{display:flex;gap:3px;padding:3px 0}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--muted);
           animation:bounce .9s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

/* Input */
.input-bar{padding:10px 12px;border-top:1px solid rgba(255,255,255,0.12);
           background:rgba(0,0,0,0.2);display:flex;gap:8px;
           align-items:flex-end;flex-shrink:0}
#msg-input{flex:1;padding:8px 12px;border:1px solid rgba(255,255,255,0.2);
           border-radius:20px;font-size:13px;font-family:var(--font);
           resize:none;outline:none;max-height:80px;
           background:rgba(255,255,255,0.1);
           color:#fff;
           line-height:1.4;transition:border-color .2s}
#msg-input::placeholder{color:rgba(255,255,255,0.4)}
#msg-input:focus{border-color:var(--primary)}
.send-btn{width:34px;height:34px;border:none;border-radius:50%;
          background:var(--primary);color:#fff;flex-shrink:0;
          display:flex;align-items:center;justify-content:center;
          cursor:pointer;transition:background .15s}
.send-btn:hover{background:var(--primary-h)}

/* Branding footer */
.branding{text-align:center;padding:5px;font-size:10px;
          color:rgba(255,255,255,0.4);background:transparent;flex-shrink:0}
.branding a{color:rgba(255,255,255,0.4);text-decoration:none}
.branding a:hover{text-decoration:underline}

/* Notification dot */
#notif-dot{position:fixed;bottom:58px;right:18px;
           width:10px;height:10px;background:#E24B4A;
           border-radius:50%;border:2px solid var(--surface);
           display:none;z-index:1000}
#notif-dot.show{display:block}
</style>
</head>
<body>

<!-- Notification dot -->
<div id="notif-dot"></div>

<!-- Bubble button -->
<button id="bubble-btn" onclick="toggleChat()" aria-label="Open chat">
  <svg class="icon-chat" width="22" height="22" fill="none" stroke="#fff"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
       viewBox="0 0 24 24">
    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
  </svg>
  <svg class="icon-close" width="20" height="20" fill="none" stroke="#fff"
       stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18"/>
    <line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
</button>

<!-- Chat window -->
<div id="chat-window">
  <div class="chat-head" id="chat-head" style="background:var(--primary)">
    <div class="chat-avatar" id="chat-avatar">AI</div>
    <div>
      <div class="head-title" id="head-title">Assistant</div>
      <div class="head-sub">Powered by Claude AI</div>
    </div>
    <button class="close-btn" onclick="toggleChat()" aria-label="Close chat">
      <svg width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div id="messages"></div>

  <div class="bubble-row bot typing" id="typing">
    <div class="av av-bot" id="typing-av">AI</div>
    <div class="bubble bot">
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="msg-input" rows="1"
      placeholder="Type a message..."
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'">
    </textarea>
    <button class="send-btn" onclick="send()" aria-label="Send">
      <svg width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
           viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="branding">
    Powered by <a href="https://chatplatform.my" target="_blank">ChatPlatform</a>
  </div>
</div>

<script>
let sessionId  = crypto.randomUUID();
let initials   = "AI";
let isOpen     = false;
let hasGreeted = false;

// Get tenant slug from URL param or data attribute
const params = new URLSearchParams(window.location.search);
const slug   = params.get("tenant") || "laman_auto";

// Base URL — points back to the platform server
const BASE = window.location.origin;

async function loadConfig() {
  try {
    const cfg = await fetch(`${BASE}/api/tenants/${slug}`).then(r => r.json());
    initials  = cfg.brand_initials || "AI";

    document.title                                        = cfg.bot_name || "Chat";
    document.getElementById("head-title").textContent    = cfg.bot_name || "Assistant";
    document.getElementById("chat-avatar").textContent   = initials;
    document.getElementById("typing-av").textContent     = initials;
    document.getElementById("bubble-btn").ariaLabel      = `Chat with ${cfg.bot_name}`;

    if (cfg.brand_color) {
      const root = document.documentElement;
      root.style.setProperty("--primary",  cfg.brand_color);
      root.style.setProperty("--user-bg",  cfg.brand_color);
      root.style.setProperty("--primary-h",cfg.brand_color+"cc");
      document.getElementById("chat-head").style.background = cfg.brand_color;
    }

    // Auto-open after 3 seconds with welcome message
    setTimeout(() => {
      if (!isOpen && !hasGreeted) {
        document.getElementById("notif-dot").classList.add("show");
      }
    }, 3000);

    // Store welcome for first open
    window._welcome = cfg.welcome_msg || "Hello! How can I help?";
  } catch(e) {
    console.error("[widget] Config load failed:", e);
  }
}

function toggleChat() {
  isOpen = !isOpen;
  document.getElementById("chat-window").classList.toggle("open", isOpen);
  document.getElementById("bubble-btn").classList.toggle("open", isOpen);
  document.getElementById("notif-dot").classList.remove("show");

  if (isOpen && !hasGreeted) {
    hasGreeted = true;
    const welcome = window._welcome || "Hello! How can I help?";
    addBubble(welcome.replace(/\n/g,"<br>"), "bot", true);
  }
}

function now() {
  return new Date().toLocaleTimeString("en-MY",
    {hour:"2-digit", minute:"2-digit"});
}

function esc(t) {
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function addBubble(text, role, isHtml = false) {
  const msgs = document.getElementById("messages");
  const row  = document.createElement("div");
  row.className = `bubble-row ${role}`;

  const av       = document.createElement("div");
  av.className   = `av av-${role}`;
  av.textContent = role === "bot" ? initials : "U";

  const b     = document.createElement("div");
  b.className = `bubble ${role}`;
  b.innerHTML = (isHtml ? text : esc(text).replace(/\n/g,"<br>"));

  row.append(av, b);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping(show) {
  document.getElementById("typing").classList.toggle("show", show);
  const msgs = document.getElementById("messages");
  msgs.scrollTop = msgs.scrollHeight;
}

async function send() {
  const inp = document.getElementById("msg-input");
  const msg = inp.value.trim();
  if (!msg) return;

  inp.value = "";
  inp.style.height = "auto";
  addBubble(msg, "user");
  showTyping(true);

  try {
    const res  = await fetch(`${BASE}/api/chat`, {
      method:  "POST",
      headers: {"Content-Type":"application/json"},
      body:    JSON.stringify({
        message:     msg,
        session_id:  sessionId,
        customer_id: "widget-visitor"
      })
    });
    const data = await res.json();
    showTyping(false);
    if (data.error) { addBubble("⚠️ " + data.error, "bot"); return; }
    addBubble(data.reply, "bot");
    sessionId = data.session_id;

    // Show notif dot if window is closed
    if (!isOpen) {
      document.getElementById("notif-dot").classList.add("show");
    }
  } catch(e) {
    showTyping(false);
    addBubble("⚠️ Connection error.", "bot");
  }
}

loadConfig();
</script>
</body>
</html>
